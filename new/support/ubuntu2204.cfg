Bootstrap: docker
From: ubuntu:22.04

%post
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get -y install \
        build-essential autoconf automake make \
        m4 bison flex gfortran pkg-config \
        libtool patch binutils unzip git subversion wget curl \
        libpng-dev libssl-dev libx11-dev zlib1g-dev libbz2-dev \
        libncurses5-dev libreadline-dev freeglut3-dev libffi-dev \
        file python2-dev python3-dev libxml2-dev \
        libfuse3-3 uidmap squashfs-tools
    wget https://github.com/apptainer/apptainer/releases/download/v1.3.4/apptainer_1.3.4_amd64.deb
    dpkg -i apptainer_1.3.4_amd64.deb
    rm apptainer_1.3.4_amd64.deb
    ln -s /usr/bin/python2 /usr/bin/python
