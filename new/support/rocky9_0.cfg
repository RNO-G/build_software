Bootstrap: docker
From: rockylinux:9.0

%post
    # Remove default repos that point at "current" Rocky (9.7),
    # which has the libc backport we're trying to avoid.
    rm -f /etc/yum.repos.d/rocky-addons.repo \
          /etc/yum.repos.d/rocky-devel.repo \
          /etc/yum.repos.d/rocky-extras.repo \
          /etc/yum.repos.d/rocky.repo

    # Pin Rocky to 9.0 vault (frozen point release)
    cat > /etc/yum.repos.d/rocky-vault.repo << 'EOF'
[baseos]
name=Rocky Linux 9.0 - BaseOS (vault)
baseurl=https://dl.rockylinux.org/vault/rocky/9.0/BaseOS/x86_64/os/
gpgcheck=1
enabled=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9

[appstream]
name=Rocky Linux 9.0 - AppStream (vault)
baseurl=https://dl.rockylinux.org/vault/rocky/9.0/AppStream/x86_64/os/
gpgcheck=1
enabled=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9

[crb]
name=Rocky Linux 9.0 - CRB (vault)
baseurl=https://dl.rockylinux.org/vault/rocky/9.0/CRB/x86_64/os/
gpgcheck=1
enabled=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9
EOF

    yum clean all
    yum makecache

    yum -y install dnf-plugins-core
    yum -y install --allowerasing gcc gcc-c++ gcc-gfortran autoconf automake make \
        m4 bison flex libstdc++ info diffutils \
        libtool patch binutils unzip xz tar gzip git subversion wget curl \
        libpng-devel openssl-devel libX11-devel bzip2-devel \
        ncurses-devel readline-devel libXext-devel libXi-devel \
        libXfixes-devel libXft-devel libXmu-devel libXpm-devel \
        libXrandr-devel libXt-devel libffi-devel \
        perl gettext texinfo \
        file which python-devel bzip2 libxml2-devel ca-certificates
    ln -s /usr/bin/python3 /usr/bin/python
