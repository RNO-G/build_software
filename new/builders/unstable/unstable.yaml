spack:
  specs:
    # ~bootstrap: this gcc gets built by our gcc 16 (see build.sh), so gcc's 3-pass self check is pointless, and slow
    - gcc@16.2.0 +binutils ~bootstrap ^zlib-ng~opt
    - cmake@4.4.4
    - fftw@3.3.11
    - gsl@2.8
    - sqlite@3.53.1
    - boost@1.90.0 +filesystem +serialization
    - cfitsio@4.6.3 cflags="-std=gnu99 -D_GNU_SOURCE"
    - python@3.14.9 +ssl +shared +zlib +sqlite3 ^sqlite@3.53.1
    - py-pip@26.2.2
    - py-pybind11@3.0.4
    - py-cython@3.2.4
    - xz@5.8.3
    - root@6.40.04 +python +gsl +tmva +roofit +ssl +spectrum +x +davix +tbb
    - ncurses@6.6~termlib
    # for PROPOSAL (see build_proposal.sh), along with boost's filesystem + serialization above.
    # cubic_interpolation's own recipe asks for eigen 3.3, so stick with the newest 3.x, not eigen 5
    - spdlog@1.17.0
    - nlohmann-json@3.12.0
    - eigen@3.4.1
  concretizer:
    unify: true
  config:
    install_tree:
      projections:
        python: "{name}/{version}"
        py-python-venv: "{name}/{version}"
  repos:
    builtin:
      git: https://github.com/spack/spack-packages.git
      tag: v2026.10.1
  packages:
    all:
      target: [x86_64_v2]
    # prefer our gcc for anything that needs a compiler. this is how the spack docs say to do it.
    # (putting it under all: instead makes spack quietly turn off root features and pick old versions)
    c:
      prefer: ["gcc@16.2.0"]
    cxx:
      prefer: ["gcc@16.2.0"]
    fortran:
      prefer: ["gcc@16.2.0"]
