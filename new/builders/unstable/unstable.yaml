spack:
  specs:
    - gcc@16.2.0 +binutils ^zlib-ng~opt
    - cmake@4.4.4
    - fftw@3.3.11
    - gsl@2.8
    - sqlite@3.53.1
    - boost@1.90.0
    - cfitsio@4.6.3 cflags="-std=gnu99 -D_GNU_SOURCE"
    - python@3.15.1 +ssl +shared +zlib +sqlite3 ^sqlite@3.53.1
    - py-pip@26.2.2
    - py-pybind11@3.0.4
    # NB: no py-cython here; spack's py-cython recipe caps python@:3.14,
    # so cython is pip-installed in build.sh instead
    - xz@5.8.3
    - root@6.40.04 +python +gsl +tmva +roofit +http +ssl +spectrum
    - ncurses@6.6~termlib
  concretizer:
    unify: true
  config:
    install_tree:
      projections:
        python: "{name}/{version}"
        py-python-venv: "{name}/{version}"
  repos:
    builtin:
      git: https://github.com/spack/spack-packages.git
      tag: v2026.10.1
  packages:
    all:
      target: [x86_64_v2]
      prefer:
        - "gcc@16.2.0"
